name: Deploy to Azure VM

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DB_URL,DB_USER,DB_PW,MAIL_USERNAME_1,MAIL_PASSWORD_1,JWT_SECRET_KEY,JWT_ACCESS_EXPIRATION,JWT_REFRESH_EXPIRATION,REDIS_HOST
          script: |
            cd /home/LeeDongwon/BackEnd
            git pull origin develop
            cat > .env << EOF
            DB_URL=$DB_URL
            DB_USER=$DB_USER
            DB_PW=$DB_PW
            MAIL_USERNAME_1=$MAIL_USERNAME_1
            MAIL_PASSWORD_1=$MAIL_PASSWORD_1
            JWT_SECRET_KEY=$JWT_SECRET_KEY
            JWT_ACCESS_EXPIRATION=$JWT_ACCESS_EXPIRATION
            JWT_REFRESH_EXPIRATION=$JWT_REFRESH_EXPIRATION
            REDIS_HOST=$REDIS_HOST
            EOF
            ./gradlew bootJar -x test
            docker-compose down
            docker-compose up -d --build
