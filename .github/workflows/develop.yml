name: Deploy to Azure VM
on:
  push:
    branches:
      - develop
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew bootJar -x test
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/homecam:latest
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/homecam:latest
            docker stop homecam || true
            docker rm homecam || true
            docker run -d --name homecam -p 8080:8080 --network host -e DB_URL="${{ secrets.DB_URL }}" -e DB_USER="${{ secrets.DB_USER }}" -e DB_PW="${{ secrets.DB_PW }}" -e MAIL_USERNAME_1="${{ secrets.MAIL_USERNAME_1 }}" -e MAIL_PASSWORD_1="${{ secrets.MAIL_PASSWORD_1 }}" -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" -e JWT_ACCESS_EXPIRATION="${{ secrets.JWT_ACCESS_EXPIRATION }}" -e JWT_REFRESH_EXPIRATION="${{ secrets.JWT_REFRESH_EXPIRATION }}" -e REDIS_HOST=localhost ${{ secrets.DOCKER_USERNAME }}/homecam:latest
