spring:
  application:
    name: HomeCam
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

jwt:
  token:
    secretKey: ${JWT_SECRET_KEY}
    expiration:
      access: ${JWT_ACCESS_EXPIRATION}
      refresh: ${JWT_REFRESH_EXPIRATION}

gpt:
  model: gpt-5.4-mini
  api:
    key: ${GPT_API_KEY}
    url: https://api.openai.com/v1/chat/completions

webrtc:
  turn:
    secret: ${TURN_SECRET}
    ttl: 86400
    urls:
      - "turn:20.189.241.58:3478?transport=udp"
      - "turn:20.189.241.58:3478?transport=tcp"